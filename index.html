    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const PLANETS = [
            { name: "TIERRA", icon: "🌍", desc: "Nuestro hogar azul. Desde aquí comienza la humanidad su expansión hacia las estrellas.", dist: "0 km", dia: "12,742 km", temp: "15°C", pos: {x:0, y:0, z:0}, cam: {x:25, y:10, z:25}, color: 0x2266ff },
            { name: "LUNA", icon: "🌙", desc: "Nuestro fiel satélite. El primer paso del hombre fuera de la Tierra.", dist: "384,400 km", dia: "3,474 km", temp: "-173°C", pos: {x:-30, y:5, z:-20}, cam: {x:-40, y:10, z:-30}, color: 0xaaaaaa },
            { name: "MARTE", icon: "🔴", desc: "El planeta rojo. Un desierto frío con el volcán más grande del sistema solar.", dist: "227M km", dia: "6,779 km", temp: "-63°C", pos: {x:50, y:-5, z:40}, cam: {x:65, y:10, z:55}, color: 0xff4422 },
            { name: "CINTURÓN", icon: "☄️", desc: "Zona de peligro. Millones de asteroides orbitan entre Marte y Júpiter.", dist: "2.5 UA", dia: "Variable", temp: "-73°C", pos: {x:-60, y:0, z:-50}, cam: {x:-50, y:20, z:-40}, color: 0x886644 },
            { name: "JÚPITER", icon: "🟠", desc: "El Rey Gigante. Un monstruo gaseoso con una tormenta eterna.", dist: "778M km", dia: "139,820 km", temp: "-108°C", pos: {x:100, y:-10, z:80}, cam: {x:130, y:20, z:110}, color: 0xff8844 }
        ];

        let scene, camera, renderer, controls, ship;
        let currentIdx = 0;
        let isAutoTour = false;
        let tourInterval;
        let asteroids = [];
        let stars;
        let cinematicMode = true;

        // Offset fijo para que la nave siempre esté a la derecha-abajo de la cámara
        const SHIP_OFFSET = new THREE.Vector3(3, -1.5, 4); 

        const ui = {
            panel: document.getElementById('info-panel'),
            name: document.getElementById('p-name'),
            icon: document.getElementById('p-icon'),
            desc: document.getElementById('p-desc'),
            sDist: document.getElementById('s-dist'),
            sDia: document.getElementById('s-dia'),
            sTemp: document.getElementById('s-temp'),
            indicators: document.getElementById('indicators'),
            loading: document.getElementById('loading-screen'),
            progress: document.getElementById('progress'),
            status: document.getElementById('load-status')
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            // Posición inicial segura
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 100;
            controls.minDistance = 2;

            const ambient = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambient);
            
            const sun = new THREE.DirectionalLight(0xffffff, 3);
            sun.position.set(50, 30, 50);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            scene.add(sun);

            createStars();
            createPlanets();
            createAsteroids();
            loadShip();

            updateUI(0);
            createIndicators();

            window.addEventListener('resize', onResize);
            
            animate();
        }

        function createStars() {
            const geo = new THREE.BufferGeometry();
            const count = 5000;
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count*3; i++) pos[i] = (Math.random() - 0.5) * 400;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8});
            stars = new THREE.Points(geo, mat);
            scene.add(stars);
        }

        function createPlanets() {
            PLANETS.forEach((p, i) => {
                const radius = i === 4 ? 12 : (i === 3 ? 0.5 : 3);
                const geo = new THREE.SphereGeometry(radius, 64, 64);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: p.color, 
                    roughness: 0.8, 
                    metalness: 0.2,
                    emissive: p.color,
                    emissiveIntensity: 0.2
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(p.pos.x, p.pos.y, p.pos.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                
                if(i === 4) {
                    const ringGeo = new THREE.RingGeometry(13, 18, 64);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0xccaa88, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2;
                    ring.position.copy(mesh.position);
                    scene.add(ring);
                }

                scene.add(mesh);
                p.mesh = mesh;
            });
        }

        function createAsteroids() {
            const geo = new THREE.DodecahedronGeometry(0.4, 0);
            const mat = new THREE.MeshStandardMaterial({ color: 0x886644, roughness: 1 });
            const center = PLANETS[3].pos;
            
            for(let i=0; i<200; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                const angle = Math.random() * Math.PI * 2;
                const rad = 15 + Math.random() * 10;
                mesh.position.set(
                    Math.cos(angle)*rad + center.x,
                    (Math.random()-0.5)*4 + center.y,
                    Math.sin(angle)*rad + center.z
                );
                mesh.userData = { speed: 0.001 + Math.random()*0.002, angle: angle, radius: rad, rot: {x:Math.random()*0.02, y:Math.random()*0.02} };
                scene.add(mesh);
                asteroids.push(mesh);
            }
        }

        function loadShip() {
            const loader = new GLTFLoader();
            loader.load(
                './models/nave.glb', 
                (gltf) => {
                    ship = gltf.scene;
                    
                    // ESCALA AUMENTADA PARA VISIBILIDAD (0.003 en vez de 0.0008)
                    const scale = 0.003; 
                    ship.scale.set(scale, scale, scale);
                    
                    // POSICIÓN INICIAL CRÍTICA:
                    // La colocamos inmediatamente detrás de la cámara actual para evitar el "salto"
                    ship.position.copy(camera.position).add(SHIP_OFFSET);
                    
                    ship.traverse(c => {
                        if(c.isMesh) {
                            c.castShadow = true;
                            c.receiveShadow = true;
                            // Asegurar que se renderice bien
                            c.material.depthWrite = true; 
                        }
                    });
                    
                    scene.add(ship);
                    console.log("✅ Nave cargada y posicionada correctamente");
                    finishLoading();
                },
                (xhr) => {
                    const pct = (xhr.loaded / xhr.total) * 100;
                    ui.progress.style.width = pct + '%';
                    ui.status.innerText = `Cargando nave: ${Math.round(pct)}%`;
                },
                (err) => {
                    console.error("❌ Error cargando nave:", err);
                    ui.status.innerText = "Error cargando modelo. Usando nave básica.";
                    createFallbackShip();
                    finishLoading();
                }
            );
        }

        function createFallbackShip() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.ConeGeometry(1, 2, 8), new THREE.MeshStandardMaterial({color: 0xff0000, emissive: 0x550000}));
            body.rotation.x = Math.PI/2;
            group.add(body);
            group.scale.set(0.5, 0.5, 0.5);
            // Posición inicial igual
            group.position.copy(camera.position).add(SHIP_OFFSET);
            scene.add(group);
            ship = group;
        }

        function finishLoading() {
            setTimeout(() => {
                ui.loading.style.opacity = 0;
                setTimeout(() => ui.loading.style.display = 'none', 1000);
                startCinematic();
            }, 800);
        }

        function startCinematic() {
            cinematicMode = true;
            const startPos = camera.position.clone();
            const targetPos = new THREE.Vector3(0, 5, 15);
            
            let t = 0;
            function anim() {
                t += 0.01;
                if(t < 1) {
                    const ease = 1 - Math.pow(1-t, 3);
                    camera.position.lerpVectors(startPos, targetPos, ease);
                    
                    // Mover la nave CON la cámara durante la cinemática
                    if(ship) {
                        const currentOffset = new THREE.Vector3(0, 0, 10); // Un poco más lejos para verla
                        const idealPos = camera.position.clone().add(currentOffset);
                        ship.position.lerp(idealPos, 0.1);
                        ship.lookAt(camera.position);
                    }

                    controls.target.set(0,0,0);
                    controls.update();
                    requestAnimationFrame(anim);
                } else {
                    cinematicMode = false;
                    // Asegurar posición final correcta al terminar cinemática
                    if(ship) ship.position.copy(camera.position).add(SHIP_OFFSET);
                }
            }
            anim();
        }

        function updateUI(idx) {
            const p = PLANETS[idx];
            ui.name.innerText = p.name;
            ui.icon.innerText = p.icon;
            ui.desc.innerText = p.desc;
            ui.sDist.innerText = p.dist;
            ui.sDia.innerText = p.dia;
            ui.sTemp.innerText = p.temp;
            
            ui.panel.classList.add('hidden');
            setTimeout(() => ui.panel.classList.remove('hidden'), 500);

            document.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === idx);
            });
        }

        function createIndicators() {
            ui.indicators.innerHTML = '';
            PLANETS.forEach((_, i) => {
                const d = document.createElement('div');
                d.className = 'dot' + (i===0 ? ' active' : '');
                d.onclick = () => goToPlanet(i);
                ui.indicators.appendChild(d);
            });
        }

        window.changePlanet = (dir) => {
            currentIdx += dir;
            if(currentIdx < 0) currentIdx = PLANETS.length - 1;
            if(currentIdx >= PLANETS.length) currentIdx = 0;
            goToPlanet(currentIdx);
        };

        function goToPlanet(idx) {
            currentIdx = idx;
            updateUI(idx);
            
            const target = PLANETS[idx];
            const camTarget = target.cam;
            const planetPos = target.pos;

            const startCam = camera.position.clone();
            const endCam = new THREE.Vector3(camTarget.x, camTarget.y, camTarget.z);
            
            // La nave viaja con la cámara manteniendo el offset
            const startShip = ship ? ship.position.clone() : new THREE.Vector3();
            const endShip = endCam.clone().add(SHIP_OFFSET);

            let t = 0;
            function fly() {
                t += 0.015;
                if(t < 1) {
                    const ease = 1 - Math.pow(1-t, 3);
                    camera.position.lerpVectors(startCam, endCam, ease);
                    controls.target.lerp(new THREE.Vector3(planetPos.x, planetPos.y, planetPos.z), ease);
                    
                    if(ship) {
                        // Interpolación muy suave para que no tiemble
                        ship.position.lerpVectors(startShip, endShip, ease);
                        // Opcional: Que mire siempre al frente del movimiento
                        // ship.lookAt(endCam); 
                    }
                    
                    controls.update();
                    requestAnimationFrame(fly);
                }
            }
            fly();
        }

        window.toggleAutoTour = () => {
            isAutoTour = !isAutoTour;
            const btn = document.getElementById('btn-auto');
            if(isAutoTour) {
                btn.innerText = "⏸ PAUSA";
                btn.style.background = "var(--primary)";
                btn.style.color = "black";
                changePlanet(1);
                tourInterval = setInterval(() => changePlanet(1), 8000);
            } else {
                btn.innerText = "▶ AUTO";
                btn.style.background = "";
                btn.style.color = "";
                clearInterval(tourInterval);
            }
        };

        window.toggleMusic = () => {
            const audio = document.getElementById('bg-music');
            const btn = document.getElementById('btn-music');
            if(audio.paused) {
                audio.play().catch(e => console.log("Audio no disponible"));
                btn.style.borderColor = "var(--primary)";
                btn.style.boxShadow = "0 0 10px var(--primary)";
            } else {
                audio.pause();
                btn.style.borderColor = "";
                btn.style.boxShadow = "";
            }
        };

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;

            PLANETS.forEach(p => { if(p.mesh) p.mesh.rotation.y += 0.001; });

            asteroids.forEach(a => {
                a.rotation.x += a.userData.rot.x;
                a.rotation.y += a.userData.rot.y;
                a.userData.angle += a.userData.speed;
                a.position.x = Math.cos(a.userData.angle) * a.userData.radius + PLANETS[3].pos.x;
                a.position.z = Math.sin(a.userData.angle) * a.userData.radius + PLANETS[3].pos.z;
            });

            if(ship) {
                if (!cinematicMode) {
                    // MODO NORMAL: La nave sigue a la cámara con offset fijo
                    const targetPos = camera.position.clone().add(SHIP_OFFSET);
                    ship.position.lerp(targetPos, 0.15); // Suavizado
                    
                    // Pequeña vibración de motor
                    ship.position.y += Math.sin(time * 20) * 0.02;
                    
                    // Orientación: Mirar hacia donde mira la cámara
                    const lookTarget = camera.position.clone().add(new THREE.Vector3(0, 0, -10).applyQuaternion(camera.quaternion));
                    ship.lookAt(lookTarget);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
