<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viaje a Júpiter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');
        :root { --primary: #00f3ff; --glass: rgba(10, 20, 40, 0.7); }
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; background: #050510; font-family: 'Rajdhani', sans-serif; color: white; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .ui-layer { position: absolute; z-index: 10; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 2rem; }
        header { display: flex; justify-content: space-between; align-items: center; pointer-events: auto; }
        h1 { font-family: 'Orbitron'; font-size: 1.5rem; text-shadow: 0 0 10px var(--primary); color: var(--primary); }
        
        button { background: var(--glass); border: 1px solid var(--primary); color: white; padding: 0.5rem 1rem; cursor: pointer; font-family: 'Orbitron'; margin-left: 10px; transition: 0.3s; backdrop-filter: blur(5px); }
        button:hover { background: var(--primary); color: black; box-shadow: 0 0 15px var(--primary); }

        #info-panel { position: absolute; top: 50%; left: 2rem; transform: translateY(-50%); width: 300px; background: var(--glass); border: 1px solid var(--primary); padding: 1.5rem; border-radius: 8px; pointer-events: auto; transition: 0.5s; }
        #info-panel.hidden { opacity: 0; transform: translateY(-40%) translateX(-20px); }
        .planet-icon { font-size: 3rem; display: block; margin-bottom: 0.5rem; }
        .planet-name { font-family: 'Orbitron'; font-size: 1.8rem; color: var(--primary); margin-bottom: 0.5rem; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 1rem; }
        .stat-label { font-size: 0.8rem; color: #aaa; }
        .stat-val { font-weight: bold; font-size: 1.1rem; }

        .nav-controls { position: absolute; bottom: 2rem; right: 2rem; display: flex; gap: 1rem; align-items: center; pointer-events: auto; }
        .indicators { display: flex; gap: 8px; }
        .dot { width: 10px; height: 10px; background: rgba(255,255,255,0.3); border-radius: 50%; cursor: pointer; }
        .dot.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); }

        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 1s; }
        .bar { width: 200px; height: 4px; background: #333; margin-top: 15px; }
        .fill { height: 100%; background: var(--primary); width: 0%; transition: 0.2s; }
    </style>
</head>
<body>

<div id="loading">
    <h2 style="font-family:'Orbitron'; color:var(--primary)">INICIANDO SISTEMAS...</h2>
    <div class="bar"><div class="fill" id="prog"></div></div>
    <p id="status-text" style="margin-top:10px; font-size:0.8rem; color:#666;">Cargando motores...</p>
</div>

<div id="canvas-container"></div>

<div class="ui-layer">
    <header>
        <h1>MISIÓN: JÚPITER</h1>
        <div>
            <button onclick="toggleAuto()" id="btn-auto">AUTO TOUR</button>
        </div>
    </header>

    <div id="info-panel">
        <span class="planet-icon" id="p-icon">🌍</span>
        <h2 class="planet-name" id="p-name">TIERRA</h2>
        <p id="p-desc">Nuestro hogar. El punto de partida.</p>
        <div class="stats">
            <div><div class="stat-label">DISTANCIA</div><div class="stat-val" id="s-dist">0 km</div></div>
            <div><div class="stat-label">TEMP</div><div class="stat-val" id="s-temp">15°C</div></div>
        </div>
    </div>

    <div class="nav-controls">
        <div class="indicators" id="dots"></div>
        <button onclick="move(-1)">❮</button>
        <button onclick="move(1)">❯</button>
    </div>
</div>

<!-- SIN IMPORTMAP PARA EVITAR ERRORES -->
<script type="module">
    // Importación directa desde CDN para asegurar compatibilidad total
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    // DATOS DEL SISTEMA SOLAR
    const DATA = [
        { name: "TIERRA", icon: "🌍", desc: "Nuestro hogar azul. Desde aquí comienza la humanidad su expansión hacia las estrellas.", dist: "0 km", temp: "15°C", pos: {x:0,y:0,z:0}, cam: {x:25,y:10,z:25}, col: 0x2266ff },
        { name: "LUNA", icon: "🌙", desc: "Nuestro fiel satélite. El primer paso del hombre fuera de la Tierra.", dist: "384,400 km", temp: "-173°C", pos: {x:-30,y:5,z:-20}, cam: {x:-40,y:10,z:-30}, col: 0xaaaaaa },
        { name: "MARTE", icon: "🔴", desc: "El planeta rojo. Un desierto frío con el volcán más grande del sistema solar.", dist: "227M km", temp: "-63°C", pos: {x:50,y:-5,z:40}, cam: {x:65,y:10,z:55}, col: 0xff4422 },
        { name: "CINTURÓN", icon: "☄️", desc: "Zona de peligro. Millones de asteroides orbitan entre Marte y Júpiter.", dist: "2.5 UA", temp: "-73°C", pos: {x:-60,y:0,z:-50}, cam: {x:-50,y:20,z:-40}, col: 0x886644 },
        { name: "JÚPITER", icon: "🟠", desc: "El Rey Gigante. Un monstruo gaseoso con una tormenta eterna.", dist: "778M km", temp: "-108°C", pos: {x:100,y:-10,z:80}, cam: {x:130,y:20,z:110}, col: 0xff8844 }
    ];

    let scene, camera, renderer, controls, ship;
    let idx = 0;
    let auto = false;
    let timer = null;
    let asteroids = [];
    let isCinematic = true;
    let loadComplete = false;

    // UI Elements
    const ui = {
        load: document.getElementById('loading'),
        prog: document.getElementById('prog'),
        status: document.getElementById('status-text'),
        panel: document.getElementById('info-panel'),
        name: document.getElementById('p-name'),
        icon: document.getElementById('p-icon'),
        desc: document.getElementById('p-desc'),
        dist: document.getElementById('s-dist'),
        temp: document.getElementById('s-temp'),
        dots: document.getElementById('dots')
    };

    function init() {
        // Escena
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        scene.fog = new THREE.FogExp2(0x050510, 0.015);

        // Cámara
        camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controles
        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 100;
        controls.minDistance = 2;

        // Luces
        const amb = new THREE.AmbientLight(0x404040, 2);
        scene.add(amb);
        
        const sun = new THREE.DirectionalLight(0xffffff, 3);
        sun.position.set(50, 30, 50);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 2048;
        sun.shadow.mapSize.height = 2048;
        scene.add(sun);

        // Objetos
        createStars();
        createPlanets();
        createAsteroids();
        
        // Cargar Nave (Siempre crea fallback por seguridad)
        createFallbackShip(); 
        loadShipModel();

        // UI Init
        updateUI();
        createDots();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    }

    function createStars() {
        const g = new THREE.BufferGeometry();
        const c = 6000;
        const p = new Float32Array(c*3);
        for(let i=0; i<c*3; i++) p[i] = (Math.random()-0.5)*400;
        g.setAttribute('position', new THREE.BufferAttribute(p, 3));
        const mat = new THREE.PointsMaterial({color:0xffffff, size:0.6, transparent:true, opacity:0.9, blending: THREE.AdditiveBlending});
        scene.add(new THREE.Points(g, mat));
    }

    function createPlanets() {
        DATA.forEach((d, i) => {
            const r = i===4 ? 12 : (i===3 ? 0.5 : 3);
            const geo = new THREE.SphereGeometry(r, 64, 64);
            const mat = new THREE.MeshStandardMaterial({ 
                color: d.col, 
                roughness: 0.8, 
                metalness: 0.2,
                emissive: d.col,
                emissiveIntensity: 0.2
            });
            const m = new THREE.Mesh(geo, mat);
            m.position.set(d.pos.x, d.pos.y, d.pos.z);
            m.castShadow = true;
            m.receiveShadow = true;
            scene.add(m);
            d.mesh = m;
            
            if(i===4) {
                const ringGeo = new THREE.RingGeometry(13, 18, 64);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xccaa88, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI/2;
                ring.position.copy(m.position);
                scene.add(ring);
            }
        });
    }

    function createAsteroids() {
        const geo = new THREE.DodecahedronGeometry(0.4, 0);
        const mat = new THREE.MeshStandardMaterial({ color: 0x886644, roughness: 1 });
        const center = DATA[3].pos;
        for(let i=0; i<200; i++) {
            const m = new THREE.Mesh(geo, mat);
            const ang = Math.random()*Math.PI*2;
            const rad = 15 + Math.random()*10;
            m.position.set(Math.cos(ang)*rad + center.x, (Math.random()-0.5)*4 + center.y, Math.sin(ang)*rad + center.z);
            m.userData = { s: 0.001+Math.random()*0.002, a: ang, r: rad, rx: Math.random()*0.02, ry: Math.random()*0.02 };
            scene.add(m);
            asteroids.push(m);
        }
    }

    // Crea una nave geométrica inmediatamente para asegurar que haya algo visible
    function createFallbackShip() {
        if(ship) scene.remove(ship);
        const g = new THREE.Group();
        const body = new THREE.Mesh(
            new THREE.ConeGeometry(1, 2.5, 8), 
            new THREE.MeshStandardMaterial({color:0x00ffff, emissive:0x004444, metalness:0.8, roughness:0.2})
        );
        body.rotation.x = Math.PI/2;
        body.castShadow = true;
        g.add(body);
        
        // Alas
        const wing = new THREE.Mesh(
            new THREE.BoxGeometry(3, 0.1, 1),
            new THREE.MeshStandardMaterial({color:0x888888})
        );
        wing.position.set(0, 0, 0.5);
        g.add(wing);

        g.scale.set(0.5, 0.5, 0.5);
        g.position.copy(camera.position).add(new THREE.Vector3(2, -1, 3));
        scene.add(g);
        ship = g;
        console.log("✅ Nave Fallback creada");
    }

    function loadShipModel() {
        const loader = new GLTFLoader();
        ui.status.innerText = "Cargando modelo 3D...";
        
        loader.load(
            './models/nave.glb', 
            (gltf) => {
                const newShip = gltf.scene;
                newShip.scale.set(0.003, 0.003, 0.003);
                newShip.position.copy(camera.position).add(new THREE.Vector3(2, -1, 3));
                
                newShip.traverse(c => { 
                    if(c.isMesh) { 
                        c.castShadow=true; 
                        c.receiveShadow=true; 
                        c.material.needsUpdate = true;
                    } 
                });
                
                scene.remove(ship); // Remover fallback
                scene.add(newShip);
                ship = newShip;
                console.log("✅ Modelo Real Cargado");
                finishLoad();
            },
            (xhr) => { 
                const pct = Math.round((xhr.loaded / xhr.total) * 100);
                ui.prog.style.width = pct + '%';
                ui.status.innerText = `Cargando: ${pct}%`;
            },
            (err) => {
                console.warn("⚠️ Error cargando modelo, usando fallback permanente", err);
                ui.status.innerText = "Modelo no encontrado. Usando nave estándar.";
                finishLoad();
            }
        );
    }

    function finishLoad() {
        if(loadComplete) return;
        loadComplete = true;
        setTimeout(() => {
            ui.load.style.opacity = 0;
            setTimeout(() => {
                ui.load.style.display = 'none';
                startCinematic();
            }, 1000);
        }, 500);
    }

    function startCinematic() {
        isCinematic = true;
        const start = camera.position.clone();
        const end = new THREE.Vector3(0, 5, 15);
        let t = 0;
        
        function anim() {
            t += 0.008;
            if(t < 1) {
                const ease = 1 - Math.pow(1-t, 3);
                camera.position.lerpVectors(start, end, ease);
                controls.target.set(0,0,0);
                controls.update();
                
                // Mover la nave con la cámara durante la intro
                if(ship) {
                    const offset = new THREE.Vector3(2, -1, 3);
                    ship.position.lerpVectors(start.clone().add(offset), end.clone().add(offset), ease);
                }
                
                requestAnimationFrame(anim);
            } else {
                isCinematic = false;
            }
        }
        anim();
    }

    function updateUI() {
        const d = DATA[idx];
        ui.name.innerText = d.name;
        ui.icon.innerText = d.icon;
        ui.desc.innerText = d.desc;
        ui.dist.innerText = d.dist;
        ui.temp.innerText = d.temp;
        
        ui.panel.classList.add('hidden');
        setTimeout(() => ui.panel.classList.remove('hidden'), 100);

        document.querySelectorAll('.dot').forEach((el, i) => {
            el.classList.toggle('active', i===idx);
        });
    }

    function createDots() {
        ui.dots.innerHTML = '';
        DATA.forEach((_, i) => {
            const d = document.createElement('div');
            d.className = 'dot' + (i===0?' active':'');
            d.onclick = () => goTo(i);
            ui.dots.appendChild(d);
        });
    }

    window.move = (dir) => {
        idx += dir;
        if(idx < 0) idx = DATA.length-1;
        if(idx >= DATA.length) idx = 0;
        goTo(idx);
    };

    function goTo(i) {
        idx = i;
        updateUI();
        const target = DATA[idx];
        
        const startCam = camera.position.clone();
        const endCam = new THREE.Vector3(target.cam.x, target.cam.y, target.cam.z);
        
        const startShip = ship ? ship.position.clone() : new THREE.Vector3();
        const offset = new THREE.Vector3(2, -1, 3);
        const endShip = endCam.clone().add(offset);

        let t = 0;
        function fly() {
            t += 0.015;
            if(t < 1) {
                const ease = 1 - Math.pow(1-t, 3);
                camera.position.lerpVectors(startCam, endCam, ease);
                controls.target.lerp(new THREE.Vector3(target.pos.x, target.pos.y, target.pos.z), ease);
                if(ship) ship.position.lerpVectors(startShip, endShip, ease);
                controls.update();
                requestAnimationFrame(fly);
            }
        }
        fly();
    }

    window.toggleAuto = () => {
        auto = !auto;
        const btn = document.getElementById('btn-auto');
        if(auto) {
            btn.innerText = "PAUSA";
            btn.style.background = "var(--primary)";
            btn.style.color = "black";
            move(1);
            timer = setInterval(() => move(1), 8000);
        } else {
            btn.innerText = "AUTO TOUR";
            btn.style.background = "";
            btn.style.color = "";
            clearInterval(timer);
        }
    };

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.001;

        DATA.forEach(d => { if(d.mesh) d.mesh.rotation.y += 0.001; });

        asteroids.forEach(a => {
            a.rotation.x += a.userData.rx;
            a.rotation.y += a.userData.ry;
            a.userData.a += a.userData.s;
            a.position.x = Math.cos(a.userData.a)*a.userData.r + DATA[3].pos.x;
            a.position.z = Math.sin(a.userData.a)*a.userData.r + DATA[3].pos.z;
        });

        if(ship) {
            if(isCinematic) {
                ship.rotation.z = Math.sin(time)*0.1;
                ship.rotation.y = Math.sin(time*0.5)*0.1;
            } else {
                // Lógica suave de seguimiento
                const offset = new THREE.Vector3(2, -1, 3);
                const targetPos = camera.position.clone().add(offset);
                ship.position.lerp(targetPos, 0.1);
                ship.position.y += Math.sin(time*20)*0.02; // Vibración motor
                
                // Orientar nave hacia donde mira la cámara
                const lookTarget = camera.position.clone().add(new THREE.Vector3(0,0,-10).applyQuaternion(camera.quaternion));
                ship.lookAt(lookTarget);
            }
        }

        controls.update();
        renderer.render(scene, camera);
    }

    // Iniciar
    init();
</script>
</body>
</html>
