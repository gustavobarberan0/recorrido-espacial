<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viaje a Júpiter - Experiencia Espacial</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        :root {
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --bg-dark: #050510;
            --glass: rgba(10, 20, 40, 0.65);
            --border: rgba(0, 243, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Rajdhani', sans-serif;
            color: white;
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--primary);
            background: linear-gradient(90deg, var(--primary), white);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls-top button {
            background: var(--glass);
            border: 1px solid var(--border);
            color: white;
            padding: 0.5rem 1rem;
            margin-left: 10px;
            cursor: pointer;
            font-family: 'Orbitron';
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .controls-top button:hover {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 15px var(--primary);
        }

        #info-panel {
            position: absolute;
            top: 50%;
            left: 2rem;
            transform: translateY(-50%);
            width: 320px;
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
            transition: opacity 0.5s ease, transform 0.5s ease;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }

        #info-panel.hidden {
            opacity: 0;
            transform: translateY(-40%) translateX(-20px);
            pointer-events: none;
        }

        .planet-icon { font-size: 3rem; margin-bottom: 0.5rem; display: block; }
        .planet-name { font-family: 'Orbitron'; font-size: 2rem; color: var(--primary); margin-bottom: 1rem; text-transform: uppercase; }
        .planet-desc { font-size: 1.1rem; line-height: 1.5; margin-bottom: 1.5rem; color: #ddd; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-top: 1px solid var(--border);
            padding-top: 1rem;
        }
        .stat-item label { font-size: 0.8rem; color: var(--primary); display: block; }
        .stat-item span { font-size: 1.1rem; font-weight: bold; }

        .nav-controls {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
            pointer-events: auto;
            align-items: center;
        }

        .nav-btn {
            width: 60px; height: 60px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            background: var(--glass);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }

        .nav-btn:hover {
            background: var(--primary);
            color: black;
            transform: scale(1.1);
        }

        .indicators {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: 0.3s;
        }
        .dot.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); transform: scale(1.3); }

        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
        }
        .loader-bar {
            width: 300px; height: 4px;
            background: #333;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }
        .loader-progress {
            position: absolute;
            top: 0; left: 0; height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.2s;
            box-shadow: 0 0 10px var(--primary);
        }
        .loading-text {
            font-family: 'Orbitron';
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        @media (max-width: 768px) {
            #info-panel { width: 90%; top: auto; bottom: 120px; left: 5%; transform: none; }
            #info-panel.hidden { transform: translateY(20px); }
            h1 { font-size: 1rem; }
            .nav-controls { bottom: 1rem; right: 1rem; }
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <h2 class="loading-text">INICIALIZANDO SISTEMAS...</h2>
        <div class="loader-bar"><div class="loader-progress" id="progress"></div></div>
        <p style="margin-top:10px; color:#666; font-size:0.8rem" id="load-status">Cargando modelos 3D</p>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header>
            <h1>MISIÓN: JÚPITER</h1>
            <div class="controls-top">
                <button onclick="toggleAutoTour()" id="btn-auto">▶ AUTO</button>
                <button onclick="toggleMusic()" id="btn-music">🎵</button>
            </div>
        </header>

        <div id="info-panel">
            <span class="planet-icon" id="p-icon">🌍</span>
            <h2 class="planet-name" id="p-name">TIERRA</h2>
            <p class="planet-desc" id="p-desc">Nuestro hogar. El punto de partida de esta increíble travesía interestelar.</p>
            <div class="stats-grid">
                <div class="stat-item"><label>DISTANCIA</label><span id="s-dist">0 km</span></div>
                <div class="stat-item"><label>DIÁMETRO</label><span id="s-dia">12,742 km</span></div>
                <div class="stat-item"><label>TEMP</label><span id="s-temp">15°C</span></div>
                <div class="stat-item"><label>TIPO</label><span>Rocoso</span></div>
            </div>
        </div>

        <div class="nav-controls">
            <div class="indicators" id="indicators"></div>
            <button class="nav-btn" onclick="changePlanet(-1)">❮</button>
            <button class="nav-btn" onclick="changePlanet(1)">❯</button>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="" type="audio/mp3">
    </audio>

    <!-- CORRECCIÓN CLAVE: Usamos rutas URL completas en los imports dentro del script -->
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

        const PLANETS = [
            { name: "TIERRA", icon: "🌍", desc: "Nuestro hogar azul. Desde aquí comienza la humanidad su expansión hacia las estrellas.", dist: "0 km", dia: "12,742 km", temp: "15°C", pos: {x:0, y:0, z:0}, cam: {x:25, y:10, z:25}, color: 0x2266ff },
            { name: "LUNA", icon: "🌙", desc: "Nuestro fiel satélite. El primer paso del hombre fuera de la Tierra.", dist: "384,400 km", dia: "3,474 km", temp: "-173°C", pos: {x:-30, y:5, z:-20}, cam: {x:-40, y:10, z:-30}, color: 0xaaaaaa },
            { name: "MARTE", icon: "🔴", desc: "El planeta rojo. Un desierto frío con el volcán más grande del sistema solar.", dist: "227M km", dia: "6,779 km", temp: "-63°C", pos: {x:50, y:-5, z:40}, cam: {x:65, y:10, z:55}, color: 0xff4422 },
            { name: "CINTURÓN", icon: "☄️", desc: "Zona de peligro. Millones de asteroides orbitan entre Marte y Júpiter.", dist: "2.5 UA", dia: "Variable", temp: "-73°C", pos: {x:-60, y:0, z:-50}, cam: {x:-50, y:20, z:-40}, color: 0x886644 },
            { name: "JÚPITER", icon: "🟠", desc: "El Rey Gigante. Un monstruo gaseoso con una tormenta eterna.", dist: "778M km", dia: "139,820 km", temp: "-108°C", pos: {x:100, y:-10, z:80}, cam: {x:130, y:20, z:110}, color: 0xff8844 }
        ];

        let scene, camera, renderer, controls, ship;
        let currentIdx = 0;
        let isAutoTour = false;
        let tourInterval;
        let asteroids = [];
        let stars;
        let cinematicMode = true;
        let shipVisible = false; // Bandera para saber si ya tenemos nave

        const ui = {
            panel: document.getElementById('info-panel'),
            name: document.getElementById('p-name'),
            icon: document.getElementById('p-icon'),
            desc: document.getElementById('p-desc'),
            sDist: document.getElementById('s-dist'),
            sDia: document.getElementById('s-dia'),
            sTemp: document.getElementById('s-temp'),
            indicators: document.getElementById('indicators'),
            loading: document.getElementById('loading-screen'),
            progress: document.getElementById('progress'),
            status: document.getElementById('load-status')
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            // Posición inicial segura
            camera.position.set(0, 5, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 100;
            controls.minDistance = 2;

            const ambient = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambient);
            
            const sun = new THREE.DirectionalLight(0xffffff, 3);
            sun.position.set(50, 30, 50);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 2048;
            sun.shadow.mapSize.height = 2048;
            scene.add(sun);

            createStars();
            createPlanets();
            createAsteroids();
            
            // Creamos una nave fallback INMEDIATAMENTE para evitar saltos y pantalla vacía
            createFallbackShip(); 
            
            loadShip();

            updateUI(0);
            createIndicators();

            window.addEventListener('resize', onResize);
            
            animate();
        }

        function createStars() {
            const geo = new THREE.BufferGeometry();
            const count = 5000;
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count*3; i++) pos[i] = (Math.random() - 0.5) * 400;
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8});
            stars = new THREE.Points(geo, mat);
            scene.add(stars);
        }

        function createPlanets() {
            PLANETS.forEach((p, i) => {
                const radius = i === 4 ? 12 : (i === 3 ? 0.5 : 3);
                const geo = new THREE.SphereGeometry(radius, 64, 64);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: p.color, 
                    roughness: 0.8, 
                    metalness: 0.2,
                    emissive: p.color,
                    emissiveIntensity: 0.2
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(p.pos.x, p.pos.y, p.pos.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                
                if(i === 4) {
                    const ringGeo = new THREE.RingGeometry(13, 18, 64);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0xccaa88, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2;
                    ring.position.copy(mesh.position);
                    scene.add(ring);
                }

                scene.add(mesh);
                p.mesh = mesh;
            });
        }

        function createAsteroids() {
            const geo = new THREE.DodecahedronGeometry(0.4, 0);
            const mat = new THREE.MeshStandardMaterial({ color: 0x886644, roughness: 1 });
            const center = PLANETS[3].pos;
            
            for(let i=0; i<200; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                const angle = Math.random() * Math.PI * 2;
                const rad = 15 + Math.random() * 10;
                mesh.position.set(
                    Math.cos(angle)*rad + center.x,
                    (Math.random()-0.5)*4 + center.y,
                    Math.sin(angle)*rad + center.z
                );
                mesh.userData = { speed: 0.001 + Math.random()*0.002, angle: angle, radius: rad, rot: {x:Math.random()*0.02, y:Math.random()*0.02} };
                scene.add(mesh);
                asteroids.push(mesh);
            }
        }

        // Nave Fallback inmediata (geométrica)
        function createFallbackShip() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.ConeGeometry(1, 2, 8), 
                new THREE.MeshStandardMaterial({color: 0x00ffff, emissive: 0x004444, metalness: 0.5})
            );
            body.rotation.x = Math.PI/2;
            group.add(body);
            
            // Posición inicial EXACTA relativa a la cámara para evitar saltos
            const offset = new THREE.Vector3(2, -1, 2);
            group.position.copy(camera.position).add(offset);
            
            group.scale.set(0.5, 0.5, 0.5);
            scene.add(group);
            ship = group;
            shipVisible = true;
            console.log("✅ Nave fallback creada y posicionada.");
        }

        function loadShip() {
            const loader = new GLTFLoader();
            loader.load(
                './models/nave.glb', 
                (gltf) => {
                    const newShip = gltf.scene;
                    const scale = 0.003; 
                    newShip.scale.set(scale, scale, scale);
                    
                    // Posicionar la nueva nave EXACTAMENTE donde está la fallback
                    newShip.position.copy(ship.position);
                    newShip.rotation.copy(ship.rotation);
                    
                    newShip.traverse(c => {
                        if(c.isMesh) {
                            c.castShadow = true;
                            c.receiveShadow = true;
                        }
                    });
                    
                    scene.add(newShip);
                    
                    // Eliminar la fallback y asignar la nueva
                    scene.remove(ship);
                    ship = newShip;
                    
                    console.log("✅ Nave GLB cargada y reemplazada sin saltos.");
                    finishLoading();
                },
                (xhr) => {
                    const pct = (xhr.loaded / xhr.total) * 100;
                    ui.progress.style.width = pct + '%';
                    ui.status.innerText = `Cargando nave: ${Math.round(pct)}%`;
                },
                (err) => {
                    console.warn("⚠️ Error cargando nave GLB, manteniendo fallback.", err);
                    ui.status.innerText = "Modelo no encontrado. Usando nave básica.";
                    finishLoading();
                }
            );
        }

        function finishLoading() {
            setTimeout(() => {
                ui.loading.style.opacity = 0;
                setTimeout(() => ui.loading.style.display = 'none', 1000);
                startCinematic();
            }, 800);
        }

        function startCinematic() {
            cinematicMode = true;
            const startPos = camera.position.clone();
            const targetPos = new THREE.Vector3(0, 5, 15);
            
            let t = 0;
            function anim() {
                t += 0.01;
                if(t < 1) {
                    const ease = 1 - Math.pow(1-t, 3);
                    camera.position.lerpVectors(startPos, targetPos, ease);
                    controls.target.set(0,0,0);
                    controls.update();
                    requestAnimationFrame(anim);
                } else {
                    cinematicMode = false;
                }
            }
            anim();
        }

        function updateUI(idx) {
            const p = PLANETS[idx];
            ui.name.innerText = p.name;
            ui.icon.innerText = p.icon;
            ui.desc.innerText = p.desc;
            ui.sDist.innerText = p.dist;
            ui.sDia.innerText = p.dia;
            ui.sTemp.innerText = p.temp;
            
            ui.panel.classList.add('hidden');
            setTimeout(() => ui.panel.classList.remove('hidden'), 500);

            document.querySelectorAll('.dot').forEach((d, i) => {
                d.classList.toggle('active', i === idx);
            });
        }

        function createIndicators() {
            ui.indicators.innerHTML = '';
            PLANETS.forEach((_, i) => {
                const d = document.createElement('div');
                d.className = 'dot' + (i===0 ? ' active' : '');
                d.onclick = () => goToPlanet(i);
                ui.indicators.appendChild(d);
            });
        }

        window.changePlanet = (dir) => {
            currentIdx += dir;
            if(currentIdx < 0) currentIdx = PLANETS.length - 1;
            if(currentIdx >= PLANETS.length) currentIdx = 0;
            goToPlanet(currentIdx);
        };

        function goToPlanet(idx) {
            currentIdx = idx;
            updateUI(idx);
            
            const target = PLANETS[idx];
            const camTarget = target.cam;
            const planetPos = target.pos;

            const startCam = camera.position.clone();
            const endCam = new THREE.Vector3(camTarget.x, camTarget.y, camTarget.z);
            
            // La nave viaja con la cámara manteniendo el offset
            const shipOffset = new THREE.Vector3(2, -1, 2); 
            const startShip = ship ? ship.position.clone() : new THREE.Vector3();
            const endShip = endCam.clone().add(shipOffset);

            let t = 0;
            function fly() {
                t += 0.015;
                if(t < 1) {
                    const ease = 1 - Math.pow(1-t, 3);
                    camera.position.lerpVectors(startCam, endCam, ease);
                    controls.target.lerp(new THREE.Vector3(planetPos.x, planetPos.y, planetPos.z), ease);
                    if(ship) ship.position.lerpVectors(startShip, endShip, ease);
                    controls.update();
                    requestAnimationFrame(fly);
                }
            }
            fly();
        }

        window.toggleAutoTour = () => {
            isAutoTour = !isAutoTour;
            const btn = document.getElementById('btn-auto');
            if(isAutoTour) {
                btn.innerText = "⏸ PAUSA";
                btn.style.background = "var(--primary)";
                btn.style.color = "black";
                changePlanet(1);
                tourInterval = setInterval(() => changePlanet(1), 8000);
            } else {
                btn.innerText = "▶ AUTO";
                btn.style.background = "";
                btn.style.color = "";
                clearInterval(tourInterval);
            }
        };

        window.toggleMusic = () => {
            const audio = document.getElementById('bg-music');
            const btn = document.getElementById('btn-music');
            if(audio.paused) {
                audio.play().catch(e => console.log("Audio no disponible"));
                btn.style.borderColor = "var(--primary)";
                btn.style.boxShadow = "0 0 10px var(--primary)";
            } else {
                audio.pause();
                btn.style.borderColor = "";
                btn.style.boxShadow = "";
            }
        };

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;

            PLANETS.forEach(p => { if(p.mesh) p.mesh.rotation.y += 0.001; });

            asteroids.forEach(a => {
                a.rotation.x += a.userData.rot.x;
                a.rotation.y += a.userData.rot.y;
                a.userData.angle += a.userData.speed;
                a.position.x = Math.cos(a.userData.angle) * a.userData.radius + PLANETS[3].pos.x;
                a.position.z = Math.sin(a.userData.angle) * a.userData.radius + PLANETS[3].pos.z;
            });

            if(ship && shipVisible) {
                if(cinematicMode) {
                    ship.rotation.z = Math.sin(time) * 0.1;
                } else {
                    // Lógica de seguimiento suave
                    const offset = new THREE.Vector3(2, -1, 2);
                    const targetPos = camera.position.clone().add(offset);
                    ship.position.lerp(targetPos, 0.1);
                    
                    ship.position.y += Math.sin(time * 20) * 0.02; // Vibración motor
                    
                    const lookAtPos = camera.position.clone().add(new THREE.Vector3(0, 0, -10).applyQuaternion(camera.quaternion));
                    ship.lookAt(lookAtPos);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
        console.log("🚀 Sistema iniciado correctamente.");
    </script>
</body>
</html>
