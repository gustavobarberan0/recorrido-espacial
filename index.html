<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viaje a Júpiter | Experiencia Espacial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --bg-dark: #050510;
            --glass: rgba(10, 20, 40, 0.6);
            --border: rgba(0, 243, 255, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Rajdhani', sans-serif;
            color: white;
            user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay */
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        /* Header */
        header {
            text-align: center;
            pointer-events: auto;
            text-shadow: 0 0 20px var(--primary);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 4px;
            background: linear-gradient(to right, var(--primary), white, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            letter-spacing: 2px;
        }

        /* Info Panel */
        #info-panel {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            width: 350px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 1.5rem;
            transform: translateX(-120%);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            pointer-events: auto;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }

        #info-panel.visible {
            transform: translateX(0);
        }

        .planet-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
        }

        .planet-icon { font-size: 3rem; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
        
        .planet-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--primary);
        }

        .planet-desc {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            color: #ddd;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .stat-item {
            background: rgba(0,0,0,0.3);
            padding: 0.5rem;
            border-radius: 5px;
            border-left: 2px solid var(--secondary);
        }

        .stat-label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }
        .stat-value { font-size: 1.1rem; font-weight: 700; }

        /* Navigation Controls */
        .controls {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
            pointer-events: auto;
            align-items: center;
        }

        .nav-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .nav-btn:hover {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 20px var(--primary);
            transform: scale(1.1);
        }

        .auto-btn {
            width: auto;
            padding: 0 1.5rem;
            border-radius: 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            border-color: var(--secondary);
            color: var(--secondary);
            background: rgba(188, 19, 254, 0.1);
        }

        .auto-btn:hover {
            background: var(--secondary);
            color: white;
            box-shadow: 0 0 20px var(--secondary);
        }

        .auto-btn.active {
            background: var(--secondary);
            color: white;
        }

        /* Indicators */
        .indicators {
            position: absolute;
            top: 50%;
            right: 2rem;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            pointer-events: auto;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .dot.active {
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            border-color: white;
            transform: scale(1.3);
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
        }

        .loader-text {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
            margin-top: 1rem;
            letter-spacing: 2px;
        }

        .progress-bar {
            width: 300px;
            height: 4px;
            background: #333;
            margin-top: 1rem;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.2s;
            box-shadow: 0 0 10px var(--primary);
        }

        @media (max-width: 768px) {
            #info-panel {
                width: 90%;
                left: 5%;
                bottom: 100px;
            }
            .controls {
                bottom: 1rem;
                right: 50%;
                transform: translateX(50%);
                width: 90%;
                justify-content: center;
            }
            .indicators {
                display: none;
            }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="loader-text">INICIALIZANDO SISTEMAS...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <header>
            <h1>EXPEDICIÓN JÚPITER</h1>
            <div class="subtitle">Ruta Interestelar: Tierra → Júpiter</div>
        </header>

        <div class="indicators" id="indicators">
            <!-- Dots generated by JS -->
        </div>

        <div id="info-panel">
            <div class="planet-header">
                <div class="planet-icon" id="p-icon">🌍</div>
                <div class="planet-name" id="p-name">TIERRA</div>
            </div>
            <div class="planet-desc" id="p-desc">
                Nuestro hogar azul. El punto de partida de esta increíble travesía hacia el gigante gaseoso.
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Distancia</div>
                    <div class="stat-value" id="s-dist">0 km</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Diámetro</div>
                    <div class="stat-value" id="s-dia">12,742 km</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Temp</div>
                    <div class="stat-value" id="s-temp">15°C</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Tipo</div>
                    <div class="stat-value" id="s-type">Rocoso</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="nav-btn" id="btn-prev">❮</button>
            <button class="nav-btn auto-btn" id="btn-auto">AUTO TOUR</button>
            <button class="nav-btn" id="btn-next">❯</button>
        </div>
    </div>

    <!-- Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- CONFIGURACIÓN DE DATOS ---
        const planetData = [
            {
                id: 0,
                name: "TIERRA",
                icon: "🌍",
                desc: "Nuestro hogar azul, el único planeta conocido con vida. Un mundo dinámico con océanos, continentes y una atmósfera protectora.",
                dist: "0 km",
                dia: "12,742 km",
                temp: "15°C",
                type: "Rocoso",
                pos: { x: 0, y: 0, z: 0 },
                camOffset: { x: 25, y: 10, z: 25 },
                color: 0x2266ff,
                size: 4
            },
            {
                id: 1,
                name: "LUNA",
                icon: "🌙",
                desc: "Nuestro satélite natural. Cubierta de cráteres, sin atmósfera, con temperaturas extremas entre día y noche.",
                dist: "384,400 km",
                dia: "3,474 km",
                temp: "-173°C",
                type: "Satélite",
                pos: { x: -35, y: 5, z: -25 },
                camOffset: { x: -45, y: 15, z: -35 },
                color: 0xaaaaaa,
                size: 1.2
            },
            {
                id: 2,
                name: "MARTE",
                icon: "🔴",
                desc: "El planeta rojo. Hogar del volcán más grande del sistema solar, Olympus Mons. Objetivo principal para la exploración humana.",
                dist: "227.9M km",
                dia: "6,779 km",
                temp: "-63°C",
                type: "Rocoso",
                pos: { x: 50, y: -5, z: 40 },
                camOffset: { x: 65, y: 10, z: 55 },
                color: 0xff4422,
                size: 2.5
            },
            {
                id: 3,
                name: "CINTURÓN",
                icon: "☄️",
                desc: "Región entre Marte y Júpiter llena de millones de asteroides. Restos de la formación del sistema solar.",
                dist: "2.2-3.2 UA",
                dia: "N/A",
                temp: "-73°C",
                type: "Asteroides",
                pos: { x: -70, y: 10, z: -50 },
                camOffset: { x: -60, y: 30, z: -45 },
                color: 0x886644,
                size: 0 // Centro invisible
            },
            {
                id: 4,
                name: "JÚPITER",
                icon: "🟠",
                desc: "El gigante gaseoso. El planeta más grande del sistema solar, con su famosa Gran Mancha Roja y más de 80 lunas.",
                dist: "778.5M km",
                dia: "139,820 km",
                temp: "-108°C",
                type: "Gaseoso",
                pos: { x: 100, y: -10, z: 80 },
                camOffset: { x: 130, y: 20, z: 100 },
                color: 0xff8844,
                size: 14
            }
        ];

        let currentPlanetIndex = 0;
        let isAutoTour = false;
        let autoTourInterval;
        let scene, camera, renderer, controls, ship;
        let planets = [];
        let asteroids = [];
        let isCinematic = true;

        // --- INICIALIZACIÓN ---
        function init() {
            const container = document.getElementById('canvas-container');

            // Escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.015);

            // Cámara
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 40); // Posición inicial segura

            // Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            // Controles
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 200;
            controls.minDistance = 5;

            // Iluminación
            const ambientLight = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 3);
            sunLight.position.set(50, 30, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            // Elementos
            createStars();
            createPlanets();
            createAsteroids();
            loadShip();

            // UI
            setupUI();
            updateInfoPanel(0);

            // Eventos
            window.addEventListener('resize', onWindowResize);

            // Loop
            animate();
        }

        // --- CREACIÓN DE OBJETOS ---
        function createStars() {
            const geometry = new THREE.BufferGeometry();
            const count = 5000;
            const positions = new Float32Array(count * 3);
            for(let i=0; i<count*3; i++) {
                positions[i] = (Math.random() - 0.5) * 400;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
        }

        function createPlanets() {
            planetData.forEach(data => {
                if (data.size === 0) return; // Saltar centro del cinturón

                const geometry = new THREE.SphereGeometry(data.size, 64, 64);
                const material = new THREE.MeshStandardMaterial({
                    color: data.color,
                    roughness: 0.7,
                    metalness: 0.1,
                    emissive: data.color,
                    emissiveIntensity: 0.2
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(data.pos.x, data.pos.y, data.pos.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                
                // Anillos para Júpiter (simulado)
                if (data.id === 4) {
                    const ringGeo = new THREE.RingGeometry(data.size + 2, data.size + 6, 64);
                    const ringMat = new THREE.MeshBasicMaterial({ 
                        color: 0xcc8866, 
                        side: THREE.DoubleSide, 
                        transparent: true, 
                        opacity: 0.4 
                    });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2;
                    ring.position.copy(mesh.position);
                    scene.add(ring);
                }

                scene.add(mesh);
                planets.push({ mesh, data });
            });
        }

        function createAsteroids() {
            const geo = new THREE.DodecahedronGeometry(0.8, 0);
            const mat = new THREE.MeshStandardMaterial({ color: 0x886644, roughness: 1 });
            const center = planetData[3].pos;

            for(let i=0; i<200; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                const angle = Math.random() * Math.PI * 2;
                const radius = 15 + Math.random() * 10;
                
                mesh.position.set(
                    Math.cos(angle) * radius + center.x,
                    (Math.random() - 0.5) * 6 + center.y,
                    Math.sin(angle) * radius + center.z
                );
                
                mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
                mesh.userData = { 
                    angle, 
                    radius, 
                    speed: 0.0005 + Math.random() * 0.001,
                    rotSpeed: { x: Math.random()*0.02, y: Math.random()*0.02 }
                };
                
                scene.add(mesh);
                asteroids.push(mesh);
            }
        }

        function loadShip() {
            const loader = new GLTFLoader();
            // AJUSTA ESTA RUTA SI TU MODELO ESTÁ EN OTRO LUGAR
            const modelPath = './models/nave.glb'; 
            
            loader.load(
                modelPath,
                (gltf) => {
                    ship = gltf.scene;
                    ship.scale.set(0.0008, 0.0008, 0.0008); // Escala tiny
                    ship.position.set(0, 12, 45); // Posición inicial segura sobre la tierra
                    
                    ship.traverse(c => {
                        if(c.isMesh) {
                            c.castShadow = true;
                            c.receiveShadow = true;
                        }
                    });
                    
                    scene.add(ship);
                    startCinematic();
                },
                (xhr) => {
                    const percent = (xhr.loaded / xhr.total) * 100;
                    document.getElementById('progress').style.width = percent + '%';
                },
                (error) => {
                    console.error("Error cargando nave:", error);
                    document.querySelector('.loader-text').textContent = "ERROR DE CARGA";
                }
            );
        }

        // --- CINEMÁTICA ---
        function startCinematic() {
            isCinematic = true;
            const startPos = camera.position.clone();
            const lookTarget = new THREE.Vector3(0, 12, 45); // Mirar a la nave
            
            // Mover cámara atrás para ver la nave pequeña
            const endPos = new THREE.Vector3(0, 14, 55);
            
            let startTime = Date.now();
            const duration = 2000; // 2 segundos

            function loop() {
                const elapsed = Date.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - t, 3);

                camera.position.lerpVectors(startPos, endPos, ease);
                controls.target.lerp(lookTarget, ease);
                controls.update();

                if(t < 1) {
                    requestAnimationFrame(loop);
                } else {
                    isCinematic = false;
                    document.getElementById('loader').style.opacity = 0;
                    setTimeout(() => document.getElementById('loader').style.display = 'none', 1000);
                    updateInfoPanel(0); // Mostrar panel inicial
                }
            }
            loop();
        }

        // --- LÓGICA DE NAVEGACIÓN ---
        function goToPlanet(index) {
            currentPlanetIndex = index;
            const data = planetData[index];
            
            // Actualizar UI
            updateInfoPanel(index);
            updateIndicators(index);

            // Mover Cámara y Nave
            const targetCamPos = new THREE.Vector3(
                data.pos.x + data.camOffset.x,
                data.pos.y + data.camOffset.y,
                data.pos.z + data.camOffset.z
            );
            
            const targetLook = new THREE.Vector3(data.pos.x, data.pos.y, data.pos.z);
            
            // La nave sigue a la cámara con un offset relativo
            const shipOffset = new THREE.Vector3(3, -1, 4); 
            const targetShipPos = targetCamPos.clone().add(shipOffset);

            const startCam = camera.position.clone();
            const startLook = controls.target.clone();
            const startShip = ship ? ship.position.clone() : new THREE.Vector3();
            
            const duration = 2500;
            const startTime = Date.now();

            function anim() {
                const elapsed = Date.now() - startTime;
                const t = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - t, 3);

                camera.position.lerpVectors(startCam, targetCamPos, ease);
                controls.target.lerpVectors(startLook, targetLook, ease);
                
                if(ship) {
                    ship.position.lerpVectors(startShip, targetShipPos, ease);
                    // Rotar nave suavemente hacia el frente
                    const lookAtPos = targetLook.clone().add(new THREE.Vector3(0,0,-10));
                    ship.lookAt(lookAtPos);
                }

                controls.update();

                if(t < 1) requestAnimationFrame(anim);
            }
            anim();
        }

        function nextPlanet() {
            let next = currentPlanetIndex + 1;
            if(next >= planetData.length) next = 0;
            goToPlanet(next);
        }

        function prevPlanet() {
            let prev = currentPlanetIndex - 1;
            if(prev < 0) prev = planetData.length - 1;
            goToPlanet(prev);
        }

        function toggleAuto() {
            isAutoTour = !isAutoTour;
            const btn = document.getElementById('btn-auto');
            
            if(isAutoTour) {
                btn.classList.add('active');
                btn.textContent = "PAUSAR";
                nextPlanet();
                autoTourInterval = setInterval(nextPlanet, 8000);
            } else {
                btn.classList.remove('active');
                btn.textContent = "AUTO TOUR";
                clearInterval(autoTourInterval);
            }
        }

        // --- UI FUNCTIONS ---
        function setupUI() {
            document.getElementById('btn-next').addEventListener('click', () => {
                if(isAutoTour) toggleAuto();
                nextPlanet();
            });
            document.getElementById('btn-prev').addEventListener('click', () => {
                if(isAutoTour) toggleAuto();
                prevPlanet();
            });
            document.getElementById('btn-auto').addEventListener('click', toggleAuto);

            // Crear indicadores
            const container = document.getElementById('indicators');
            planetData.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.onclick = () => {
                    if(isAutoTour) toggleAuto();
                    goToPlanet(i);
                };
                container.appendChild(dot);
            });
            updateIndicators(0);
        }

        function updateInfoPanel(index) {
            const data = planetData[index];
            const panel = document.getElementById('info-panel');
            
            // Ocultar brevemente para efecto
            panel.classList.remove('visible');
            
            setTimeout(() => {
                document.getElementById('p-icon').textContent = data.icon;
                document.getElementById('p-name').textContent = data.name;
                document.getElementById('p-desc').textContent = data.desc;
                document.getElementById('s-dist').textContent = data.dist;
                document.getElementById('s-dia').textContent = data.dia;
                document.getElementById('s-temp').textContent = data.temp;
                document.getElementById('s-type').textContent = data.type;
                panel.classList.add('visible');
            }, 300);
        }

        function updateIndicators(index) {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((d, i) => {
                d.classList.toggle('active', i === index);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Rotar planetas
            planets.forEach(p => {
                p.mesh.rotation.y += 0.001;
            });

            // Animar asteroides
            asteroids.forEach(ast => {
                ast.userData.angle += ast.userData.speed;
                ast.position.x = Math.cos(ast.userData.angle) * ast.userData.radius + planetData[3].pos.x;
                ast.position.z = Math.sin(ast.userData.angle) * ast.userData.radius + planetData[3].pos.z;
                ast.rotation.x += ast.userData.rotSpeed.x;
                ast.rotation.y += ast.userData.rotSpeed.y;
            });

            // Comportamiento de la nave
            if(ship && !isCinematic) {
                // Flotación suave
                ship.position.y += Math.sin(time * 2) * 0.02;
                
                // Si no estamos en transición, la nave sigue suavemente a la cámara
                // (Esto ya se maneja en la transición, pero aquí añadimos el offset constante si está quieto)
                if(!isAutoTour && controls) {
