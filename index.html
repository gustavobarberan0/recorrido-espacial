<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viaje Espacial: Tierra a Júpiter</title>
    
    <!-- Fuentes Robóticas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --bg-dark: #050510;
            --panel-bg: rgba(10, 20, 40, 0.65);
            --text-main: #e0f7fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            user-select: none;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none; /* Dejar pasar clicks al canvas excepto en botones */
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
        }

        /* Header */
        header {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--primary);
            pointer-events: auto;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary), #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--primary);
            opacity: 0.8;
        }

        /* Panel de Información (Izquierda) */
        .info-panel {
            position: absolute;
            top: 50%;
            left: 2rem;
            transform: translateY(-50%);
            width: 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-left: 4px solid var(--primary);
            padding: 2rem;
            border-radius: 0 15px 15px 0;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
            pointer-events: auto;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .info-panel.hidden {
            opacity: 0;
            transform: translateY(-50%) translateX(-50px);
            pointer-events: none;
        }

        .planet-icon { font-size: 3rem; margin-bottom: 1rem; display: block; filter: drop-shadow(0 0 10px rgba(255,255,255,0.5)); }
        .planet-name { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: var(--primary); margin-bottom: 1rem; text-transform: uppercase; }
        .planet-desc { font-size: 1.1rem; line-height: 1.6; margin-bottom: 1.5rem; color: #ccc; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 1rem;
        }
        .stat-item { font-size: 0.9rem; }
        .stat-label { color: var(--secondary); font-weight: bold; display: block; font-size: 0.8rem; text-transform: uppercase; }
        .stat-value { font-family: 'Orbitron', monospace; font-size: 1.1rem; }

        /* Controles de Navegación (Abajo) */
        .controls-container {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 1.5rem;
            pointer-events: auto;
            background: rgba(0,0,0,0.5);
            padding: 1rem 2rem;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
        }

        .nav-btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
        }

        .nav-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }

        .nav-btn.auto-mode {
            border-color: var(--secondary);
            color: var(--secondary);
        }
        .nav-btn.auto-mode:hover {
            background: var(--secondary);
            color: #fff;
            box-shadow: 0 0 15px var(--secondary);
        }

        /* Indicadores de Planetas (Derecha) */
        .indicators {
            position: absolute;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            pointer-events: auto;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator.active {
            background: var(--primary);
            border-color: #fff;
            box-shadow: 0 0 10px var(--primary);
            transform: scale(1.3);
        }

        .indicator:hover {
            border-color: var(--primary);
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease;
        }
        .loader-bar {
            width: 300px;
            height: 4px;
            background: #333;
            margin-top: 20px;
            border-radius: 2px;
            overflow: hidden;
        }
        .loader-progress {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.2s;
            box-shadow: 0 0 10px var(--primary);
        }
        .loading-text {
            font-family: 'Orbitron';
            color: var(--primary);
            letter-spacing: 2px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .info-panel {
                top: auto; bottom: 120px; left: 1rem; right: 1rem;
                width: auto; transform: none;
                border-radius: 15px;
                border-left: 4px solid var(--primary);
                padding: 1.5rem;
            }
            .indicators { display: none; }
            h1 { font-size: 1.8rem; }
            .controls-container { bottom: 1rem; width: 90%; justify-content: space-between; }
            .nav-btn { padding: 0.6rem 1rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- Pantalla de Carga -->
    <div id="loading-screen">
        <div class="loading-text">INICIALIZANDO SISTEMAS...</div>
        <div class="loader-bar"><div class="loader-progress" id="progress"></div></div>
    </div>

    <!-- Contenedor 3D -->
    <div id="canvas-container"></div>

    <!-- Interfaz de Usuario -->
    <div class="ui-layer">
        <header>
            <h1>Misión Júpiter</h1>
            <div class="subtitle">Simulador de Viaje Interestelar</div>
        </header>

        <div class="info-panel" id="info-panel">
            <span class="planet-icon" id="p-icon">🌍</span>
            <h2 class="planet-name" id="p-name">Tierra</h2>
            <p class="planet-desc" id="p-desc">Nuestro hogar. El punto de partida de esta épica travesía hacia el gigante gaseoso.</p>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Distancia</span>
                    <span class="stat-value" id="p-dist">0 km</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Diámetro</span>
                    <span class="stat-value" id="p-diam">12,742 km</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Temp</span>
                    <span class="stat-value" id="p-temp">15°C</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Tipo</span>
                    <span class="stat-value" id="p-type">Rocoso</span>
                </div>
            </div>
        </div>

        <div class="indicators" id="indicators">
            <!-- Se generan con JS -->
        </div>

        <div class="controls-container">
            <button class="nav-btn" id="btn-prev">◀ Anterior</button>
            <button class="nav-btn auto-mode" id="btn-auto">▶ Auto Tour</button>
            <button class="nav-btn" id="btn-next">Siguiente ▶</button>
        </div>
    </div>

    <!-- Three.js desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- CONFIGURACIÓN DE DATOS ---
        const planetsData = [
            {
                id: 0, name: "TIERRA", icon: "🌍", desc: "El único planeta conocido con vida. Un mundo azul dinámico protegido por una atmósfera densa.",
                dist: "0 km", diam: "12,742 km", temp: "15°C", type: "Rocoso",
                pos: { x: 0, y: 0, z: 0 }, cam: { x: 25, y: 10, z: 25 }, color: 0x2266ff, size: 3
            },
            {
                id: 1, name: "LUNA", icon: "🌙", desc: "Nuestro fiel satélite. Cubierta de cráteres y mares oscuros de lava antigua.",
                dist: "384,400 km", diam: "3,474 km", temp: "-173°C", type: "Satélite",
                pos: { x: -35, y: 5, z: -25 }, cam: { x: -45, y: 15, z: -35 }, color: 0xaaaaaa, size: 1.2
            },
            {
                id: 2, name: "MARTE", icon: "🔴", desc: "El Planeta Rojo. Hogar del volcán más grande del sistema solar, Olympus Mons.",
                dist: "227M km", diam: "6,779 km", temp: "-63°C", type: "Rocoso",
                pos: { x: 50, y: -5, z: 40 }, cam: { x: 65, y: 10, z: 55 }, color: 0xff4422, size: 2
            },
            {
                id: 3, name: "CINTURÓN", icon: "☄️", desc: "Millones de asteroides orbitando entre Marte y Júpiter. Restos de la formación solar.",
                dist: "2.5 UA", diam: "Variable", temp: "-73°C", type: "Asteroides",
                pos: { x: -70, y: 10, z: -50 }, cam: { x: -60, y: 30, z: -40 }, color: 0x886644, size: 0 // Centro virtual
            },
            {
                id: 4, name: "JÚPITER", icon: "🟠", desc: "El Rey de los Planetas. Un gigante gaseoso con una tormenta eterna: La Gran Mancha Roja.",
                dist: "778M km", diam: "139,820 km", temp: "-108°C", type: "Gaseoso",
                pos: { x: 100, y: -10, z: 80 }, cam: { x: 130, y: 20, z: 100 }, color: 0xffaa44, size: 10
            }
        ];

        let currentPlanetIndex = 0;
        let isAutoTour = false;
        let tourInterval = null;
        let cinematicMode = true; // Empieza en modo cine

        // --- VARIABLES THREE.JS ---
        let scene, camera, renderer, controls;
        let ship = null;
        let asteroids = [];
        let planetMeshes = [];

        // --- INICIALIZACIÓN ---
        function init() {
            const container = document.getElementById('canvas-container');

            // Escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);
            scene.fog = new THREE.FogExp2(0x050510, 0.002);

            // Cámara
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 110, 240); // Posición inicial para la cinemática

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // Controles
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 300;
            controls.autoRotate = false;

            // Iluminación
            setupLights();

            // Elementos
            createStars();
            loadShip();
            createPlanets();
            createAsteroids();

            // UI
            setupUI();
            updateInfoPanel(0);

            // Events
            window.addEventListener('resize', onWindowResize);

            // Loop
            animate();
        }

        function setupLights() {
            const ambient = new THREE.AmbientLight(0x404040, 2);
            scene.add(ambient);

            const sunLight = new THREE.DirectionalLight(0xffffff, 3);
            sunLight.position.set(50, 30, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);
        }

        function createStars() {
            const geo = new THREE.BufferGeometry();
            const count = 8000;
            const pos = new Float32Array(count * 3);
            const col = new Float32Array(count * 3);
            
            for(let i=0; i<count*3; i+=3) {
                const r = 200 + Math.random() * 300;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                pos[i] = r * Math.sin(phi) * Math.cos(theta);
                pos[i+1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i+2] = r * Math.cos(phi);
                
                const c = new THREE.Color().setHSL(0.6, 0.5, Math.random()*0.5+0.5);
                col[i] = c.r; col[i+1] = c.g; col[i+2] = c.b;
            }
            
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
            
            const mat = new THREE.PointsMaterial({ size: 0.7, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false });
            scene.add(new THREE.Points(geo, mat));
        }

        function createPlanets() {
            planetsData.forEach(data => {
                if (data.size === 0) return; // Saltar centro del cinturón
                
                const geo = new THREE.SphereGeometry(data.size, 64, 64);
                const mat = new THREE.MeshStandardMaterial({
                    color: data.color,
                    roughness: 0.8,
                    metalness: 0.1,
                    emissive: data.color,
                    emissiveIntensity: 0.2
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(data.pos.x, data.pos.y, data.pos.z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
                planetMeshes.push(mesh);

                // Anillos para Júpiter (simulado)
                if (data.id === 4) {
                    const ringGeo = new THREE.RingGeometry(data.size + 1, data.size + 4, 64);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0xccaa88, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2;
                    ring.position.copy(mesh.position);
                    scene.add(ring);
                }
            });
        }

        function createAsteroids() {
            const geo = new THREE.DodecahedronGeometry(0.5, 0);
            const mat = new THREE.MeshStandardMaterial({ color: 0x886644, roughness: 1 });
            const center = planetsData[3].pos;

            for (let i = 0; i < 300; i++) {
                const mesh = new THREE.Mesh(geo, mat);
                const angle = Math.random() * Math.PI * 2;
                const radius = 15 + Math.random() * 10;
                
                mesh.position.set(
                    Math.cos(angle) * radius + center.x,
                    (Math.random() - 0.5) * 5 + center.y,
                    Math.sin(angle) * radius + center.z
                );
                
                mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
                mesh.userData = { 
                    angle: angle, radius: radius, speed: 0.0005 + Math.random()*0.001,
                    rotSpeed: { x: Math.random()*0.02, y: Math.random()*0.02 }
                };
                scene.add(mesh);
                asteroids.push(mesh);
            }
        }

        function loadShip() {
            const loader = new GLTFLoader();
            const progressEl = document.getElementById('progress');
            
            loader.load(
                './models/nave.glb',
                (gltf) => {
                    ship = gltf.scene;
                    
                    // ESCALA Y POSICIÓN SEGURA
                    ship.scale.set(0.0005, 0.0005, 0.0005);
                    ship.position.set(0, 100, 200); // Lejos de la Tierra
                    
                    ship.traverse(c => {
                        if (c.isMesh) {
                            c.castShadow = true;
                            c.receiveShadow = true;
                        }
                    });
                    
                    scene.add(ship);
                    startCinematic();
                    
                    // Ocultar loading
                    setTimeout(() => {
                        document.getElementById('loading-screen').style.opacity = 0;
                        setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 1000);
                    }, 1000);
                },
                (xhr) => {
                    const pct = (xhr.loaded / xhr.total) * 100;
                    progressEl.style.width = pct + '%';
                },
                (err) => {
                    console.error("Error cargando nave", err);
                    document.querySelector('.loading-text').textContent = "ERROR DE CARGA";
                }
            );
        }

        // --- CINEMÁTICA ---
        function startCinematic() {
            if (!ship) return;
            cinematicMode = true;
            const duration = 5000; // 5 segundos
            const start = Date.now();
            
            const startPos = new THREE.Vector3(0, 120, 250);
            const midPos = new THREE.Vector3(20, 105, 220);
            const endPos = new THREE.Vector3(0, 99, 205); // Detrás de la nave

            function loop() {
                const now = Date.now();
                const elapsed = now - start;
                const t = Math.min(elapsed / duration, 1);
                const ease = t < 0.5 ? 2*t*t : -1 + (4-2*t)*t;

                let currentPos;
                if (t < 0.5) {
                    const p = t * 2;
                    currentPos = startPos.clone().lerp(midPos, p);
                } else {
                    const p = (t - 0.5) * 2;
                    currentPos = midPos.clone().lerp(endPos, p);
                }

                camera.position.copy(currentPos);
                controls.target.lerp(ship.position, 0.1);
                controls.update();

                if (t < 1) {
                    requestAnimationFrame(loop);
                } else {
                    cinematicMode = false;
                }
            }
            loop();
        }

        // --- LÓGICA DE NAVEGACIÓN ---
        function goToPlanet(index) {
            currentPlanetIndex = index;
            const data = planetsData[index];
            
            updateInfoPanel(index);
            updateIndicators(index);

            const targetCam = new THREE.Vector3(data.cam.x, data.cam.y, data.cam.z);
            const targetLook = new THREE.Vector3(data.pos.x, data.pos.y, data.pos.z);
            
            // La nave viaja con la cámara
            const shipOffset = new THREE.Vector3(2, -1, 3);
            const targetShip = targetCam.clone().add(shipOffset);

            const startCam = camera.position.clone();
            const startLook = controls.target.clone();
            const startShip = ship ? ship.position.clone() : new THREE.Vector3();
            
            const duration = 2000;
            const start = Date.now();

            function anim() {
                const t = Math.min((Date.now() - start) / duration, 1);
                const ease = 1 - Math.pow(1-t, 3);

                camera.position.lerpVectors(startCam, targetCam, ease);
                controls.target.lerpVectors(startLook, targetLook, ease);
                if (ship) ship.position.lerpVectors(startShip, targetShip, ease);

                controls.update();
                if (t < 1) requestAnimationFrame(anim);
            }
            anim();
        }

        function nextPlanet() {
            let next = currentPlanetIndex + 1;
            if (next >= planetsData.length) next = 0;
            goToPlanet(next);
        }

        function prevPlanet() {
            let prev = currentPlanetIndex - 1;
            if (prev < 0) prev = planetsData.length - 1;
            goToPlanet(prev);
        }

        function toggleAuto() {
            isAutoTour = !isAutoTour;
            const btn = document.getElementById('btn-auto');
            if (isAutoTour) {
                btn.textContent = "⏸ Pausa";
                btn.classList.add('active');
                nextPlanet();
                tourInterval = setInterval(nextPlanet, 8000);
            } else {
                btn.textContent = "▶ Auto Tour";
                btn.classList.remove('active');
                clearInterval(tourInterval);
            }
        }

        // --- UI FUNCTIONS ---
        function setupUI() {
            document.getElementById('btn-next').addEventListener('click', () => {
                if(isAutoTour) toggleAuto();
                nextPlanet();
            });
            document.getElementById('btn-prev').addEventListener('click', () => {
                if(isAutoTour) toggleAuto();
                prevPlanet();
            });
            document.getElementById('btn-auto').addEventListener('click', toggleAuto);

            // Generar indicadores
            const container = document.getElementById('indicators');
            planetsData.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'indicator' + (i===0 ? ' active' : '');
                dot.onclick = () => {
                    if(isAutoTour) toggleAuto();
                    goToPlanet(i);
                };
                container.appendChild(dot);
            });
        }

        function updateInfoPanel(index) {
            const d = planetsData[index];
            document.getElementById('p-icon').textContent = d.icon;
            document.getElementById('p-name').textContent = d.name;
            document.getElementById('p-desc').textContent = d.desc;
            document.getElementById('p-dist').textContent = d.dist;
            document.getElementById('p-diam').textContent = d.diam;
            document.getElementById('p-temp').textContent = d.temp;
            document.getElementById('p-type').textContent = d.type;
            
            const panel = document.getElementById('info-panel');
            panel.style.opacity = 0;
            setTimeout(() => panel.style.opacity = 1, 300);
        }

        function updateIndicators(index) {
            const dots = document.querySelectorAll('.indicator');
            dots.forEach((d, i) => d.classList.toggle('active', i === index));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;

            // Rotación planetas
            planetMeshes.forEach(p => p.rotation.y += 0.0005);

            // Asteroides
            asteroids.forEach(a => {
                a.userData.angle += a.userData.speed;
                a.position.x = Math.cos(a.userData.angle) * a.userData.radius + planetsData[3].pos.x;
                a.position.z = Math.sin(a.userData.angle) * a.userData.radius + planetsData[3].pos.z;
                a.rotation.x += a.userData.rotSpeed.x;
                a.rotation.y += a.userData.rotSpeed.y;
            });

            // Nave
            if (ship) {
                if (cinematicMode) {
                    ship.position.y += Math.sin(time * 2) * 0.05;
                    ship.rotation.z = Math.sin(time) * 0.05;
                } else {
                    // Modo vuelo: seguir cámara suavemente
                    const offset = new THREE.Vector3(2, -0.8, 2.5);
                    const target = camera.position.clone().add(offset);
                    ship.position.lerp(target, 0.1);
                    ship.position.y += Math.sin(time * 15) * 0.02; // Vibración motor
                    
                    // Orientar nave hacia adelante
                    const lookTarget = camera.position.clone().add(new THREE.Vector3(0,0,-10).applyQuaternion(camera.quaternion));
                    ship.lookAt(lookTarget);
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Arrancar
        init();
    </script>
</body>
</html>
